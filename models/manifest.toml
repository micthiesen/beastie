version = 1

# Model artifacts are intentionally absent from git. The llama.cpp worker accepts
# an explicit local GGUF path; no candidate becomes a shipping model until its
# exact source, revision, license, byte size, and SHA-256 are recorded here.

[runtime.llama_cpp]
evaluation_executable = "llama-cli"
shipping_executable = "llama-server"
tested_version = "10310 (cb26014d9)"
interface = "authenticated loopback sidecar"
network = false
archive = "llama-b10310-bin-macos-arm64.tar.gz"
archive_bytes = 10982134
archive_sha256 = "fdec9afcb2ee389dee74cc7c5f86c7f270b0f88fb248f0a7d1e5956fa61f100b"

# CPU-only evaluation must pass all three flags. `-ngl 0` alone still initializes
# Metal on the development Mac.
cpu_only_args = ["--device", "none", "--no-op-offload", "-ngl", "0"]

