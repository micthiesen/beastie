[integration_contract]
status = "design-only-until-native-windows-build-is-cleared"
voice = "slt"
output_sample_rate_hz = 24000
output_channels = 1
output_format = "PCM16 WAV"
init = "Call flite_init() once, then flite_voice_select(\"slt\") in one persistent worker process."
request = "Bound UTF-8 text, one request at a time; call flite_text_to_wave(text, voice)."
conversion = "Call cst_wave_resample(wave, 24000), validate duration and sample count, then write bounded RIFF PCM16 bytes to a content-addressed cache entry."
cleanup = "Call delete_wave(wave) after copying/serializing the samples; stop the worker on quit."
security = "No shell, network, model file, or Python dependency; preserve outer Beastie bounds and authored fallback."
note = "Flite's public header says initialization is required before synthesis and the README says it is thread-safe after initialization; serialize requests for the first adapter."

[windows]
status = "blocked"
cmake = false
native_msvc_path = "not release-ready"
evidence = "Root flite.sln is Visual Studio 14-era, exposes only Debug/Release Win32, references missing flite/flite.vcxproj, and mixes .vcxproj with obsolete .vcproj files. windows/Makefile is explicitly Windows Mobile and MinGW. SAPI projects target old Visual C++/SAPI SDK workflows, not a maintained Beastie CLI/library path."
accepted_paths = ["Visual Studio/MSVC after a maintained project is repaired and tested", "mingw32 only if Beastie explicitly accepts a native Win32/PE artifact"]
rejected_paths = ["Cygwin", "WSL"]

[licensing]
core = "BSD-like CMU license in COPYING"
third_party = "COPYING enumerates NAIST/NITECH/CMU MLSA/MLPG/VC, Cepstral/Cobalt SAPI, University of Toronto regex, Sun G72x, Festival/University of Edinburgh-derived models, FSF build scripts, and UIUC Apache-2.0 grapheme tables"
redistribution = "Technically compatible with MIT-style Beastie distribution when COPYING and required third-party notices are shipped"
release_gate = "Assemble and retain the complete notice set; do not describe the aggregate as a single SPDX license without preserving the exceptions"
