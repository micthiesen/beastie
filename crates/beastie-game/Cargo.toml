[package]
name = "beastie-game"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Integration only. The paired worker feature statically embeds GPLv3 espeak-ng.
experimental-gpl-tts = []

[dependencies]
meshopt = "=0.6.2"
beastie-core = { path = "../beastie-core" }
beastie-protocol = { path = "../beastie-protocol" }
beastie-session = { path = "../beastie-session" }
beastie-view = { path = "../beastie-view" }
clap.workspace = true
cpal = "0.17"
bevy = { workspace = true, features = ["system_clipboard"] }
winit = { version = "0.30.13", default-features = false }
wgpu = { version = "29.0.4", default-features = false }
rustybuzz = "0.20"
lyon_tessellation = "1"
unicode-segmentation = "1.12"
directories.workspace = true
image.workspace = true
rodio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in", "spv-out", "hlsl-out", "msl-out"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
