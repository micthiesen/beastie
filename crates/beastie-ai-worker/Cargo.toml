[package]
name = "beastie-ai-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
beastie-protocol = { path = "../beastie-protocol" }
clap = { workspace = true, features = ["env"] }
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.5", optional = true, default-features = false, features = ["static"] }
transcribe-rs = { version = "=0.3.8", features = ["onnx"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = []
# LICENSE BLOCKER: sherpa-onnx 1.13.5 statically embeds GPLv3 espeak-ng.
# Never enable this in a distributed Beastie build until that dependency is removed
# or the product's licensing plan explicitly changes.
experimental-gpl-tts = ["dep:sherpa-onnx"]

[[bin]]
name = "beastie-tts"
path = "src/bin/beastie-tts.rs"

[[bin]]
name = "beastie-stt"
path = "src/bin/beastie-stt.rs"
