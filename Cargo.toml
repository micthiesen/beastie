[workspace]
resolver = "3"
members = [
  "crates/beastie-ai-worker",
  "crates/beastie-core",
  "crates/beastie-game",
  "crates/beastie-protocol",
  "crates/beastie-session",
  "crates/beastie-view",
  "crates/xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bevy = { version = "0.19.1", default-features = false, features = ["default_app", "default_platform", "bevy_pbr", "png"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

# Line tables keep panics and profilers readable while cutting debug-info
# size, link time and disk use; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

# Interactive CPU profiling while retaining application assertions and overflow checks.
[profile.dev-perf]
inherits = "dev"
opt-level = 2
debug = 1
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 16
lto = false

# Profilers need dependency symbols; keep them in this profile only.
[profile.dev-perf.package."*"]
debug = 1

# Objective-C per-message validation is a development-only dependency cost.
# Disable this crate's debug checks only for interactive profiling; application
# assertions, overflow checks, and the normal dev/test verification remain enabled.
[profile.dev-perf.package."objc2@0.6.4"]
debug-assertions = false
