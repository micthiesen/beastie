[workspace]
resolver = "3"
members = [
  "crates/beastie-ai-worker",
  "crates/beastie-core",
  "crates/beastie-game",
  "crates/beastie-protocol",
  "crates/beastie-session",
  "crates/beastie-view",
  "crates/xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bevy = { version = "0.19.1", default-features = false, features = ["default_app", "default_platform", "bevy_pbr", "png"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
